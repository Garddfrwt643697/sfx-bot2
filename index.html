<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SFX Gaming Club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #ffffff;
            --neon-blue: #00f0ff;
            --neon-pink: #ff00ff;
            --neon-green: #39ff14;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --card-bg: rgba(20, 20, 20, 0.85);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            padding-bottom: 100px;
            /* Красивый градиентный фон с анимированными пятнами */
            background: 
                radial-gradient(circle at 10% 20%, rgba(0, 240, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(57, 255, 20, 0.05) 0%, transparent 50%),
                linear-gradient(180deg, #0a0a1a 0%, #050505 100%);
            background-attachment: fixed;
        }

        /* --- ГЛАВНЫЙ ЭКРАН --- */
        .hero {
            position: relative;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.1) 0%, transparent 70%);
            z-index: 1;
        }

        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.5;
            animation: float 8s infinite alternate ease-in-out;
        }
        .orb-1 { width: 350px; height: 350px; background: var(--neon-blue); top: -15%; left: -20%; }
        .orb-2 { width: 300px; height: 300px; background: var(--neon-pink); bottom: 10%; right: -25%; animation-delay: -4s; }
        .orb-3 { width: 200px; height: 200px; background: var(--neon-green); top: 40%; left: 60%; animation-delay: -2s; opacity: 0.3; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 60px) scale(1.3); }
        }

        .hero-content {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 24px;
            color: var(--neon-blue);
            text-shadow: 0 0 15px var(--neon-blue);
            z-index: 3;
        }

        .hero h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 5.5rem;
            font-weight: 900;
            letter-spacing: 8px;
            margin-bottom: 5px;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-blue), 0 0 30px var(--neon-blue), 0 0 60px var(--neon-pink);
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { text-shadow: 0 0 10px var(--neon-blue), 0 0 30px var(--neon-blue); }
            100% { text-shadow: 0 0 20px var(--neon-blue), 0 0 50px var(--neon-pink), 0 0 80px var(--neon-blue); }
        }

        .hero p {
            font-size: 1.1rem;
            margin-bottom: 40px;
            color: #ccc;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .review-buttons {
            display: flex;
            gap: 20px;
            margin-bottom: 50px;
            z-index: 3;
        }

        .review-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-weight: 900;
            font-size: 1.2rem;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            position: relative;
        }

        .review-btn.yandex {
            background: linear-gradient(135deg, #fc3f1d, #d42e0f);
            color: #fff;
            border: 2px solid #ff6b52;
            box-shadow: 0 0 15px rgba(252, 63, 29, 0.5);
        }

        .review-btn.2gis {
            background: linear-gradient(135deg, #2b9e4b, #1e7a36);
            color: #fff;
            border: 2px solid #4cd964;
            box-shadow: 0 0 15px rgba(43, 158, 75, 0.5);
        }

        .review-btn:active { transform: scale(0.9); }
        .review-btn span { font-size: 0.6rem; position: absolute; bottom: -25px; color: #fff; white-space: nowrap; font-family: 'Rajdhani'; font-weight: 700; letter-spacing: 1px;}

        /* --- ОНЛАЙН-МЕНЮ --- */
        .menu-section {
            padding: 40px 15px;
            background: transparent;
            position: relative;
            z-index: 2;
        }

        .menu-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 25px;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-pink);
        }

        .menu-title span { color: var(--neon-pink); }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .card:active { transform: scale(0.97); }

        .card-img {
            width: 100%;
            height: 120px;
            background: #1a1a1a;
            border-radius: 12px;
            margin-bottom: 10px;
            object-fit: contain;
            padding: 10px;
        }

        .card h3 {
            font-size: 1rem;
            margin-bottom: 5px;
            color: #eee;
            font-weight: 700;
            line-height: 1.2;
        }

        .card .price {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: var(--neon-green);
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
        }

        .add-btn {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 900;
            font-size: 1.2rem;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .add-btn:active { background: var(--neon-blue); color: #000; }

        .qty-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.5);
            border-radius: 8px;
            border: 1px solid var(--neon-blue);
            overflow: hidden;
        }

        .qty-btn {
            background: transparent;
            border: none;
            color: var(--neon-blue);
            padding: 8px 15px;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
        }

        .qty-btn:active { background: rgba(0, 240, 255, 0.2); }

        .qty-val {
            font-family: 'Orbitron';
            font-weight: 700;
            color: #fff;
        }

        /* --- ПЛАВАЮЩАЯ КНОПКА КОРЗИНЫ --- */
        .floating-cart {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-pink));
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6), 0 0 40px rgba(255, 0, 255, 0.4);
            z-index: 100;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: scale(0);
        }

        .floating-cart.active {
            transform: scale(1);
        }

        .floating-cart:active { transform: scale(0.9); }

        .floating-cart svg {
            width: 30px;
            height: 30px;
            fill: #fff;
        }

        .cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #fff;
            color: #000;
            font-family: 'Orbitron';
            font-weight: 900;
            font-size: 0.9rem;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* --- МОДАЛЬНОЕ ОКНО --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: #0f0f0f;
            width: 100%;
            max-width: 500px;
            border-radius: 24px 24px 0 0;
            padding: 25px 20px;
            border-top: 2px solid var(--neon-blue);
            box-shadow: 0 -10px 40px rgba(0, 240, 255, 0.15);
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            color: #fff;
        }

        .close-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 2rem;
            cursor: pointer;
            line-height: 1;
        }

        .checkout-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            background: #1a1a1a;
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid #333;
        }

        .checkout-item-info {
            display: flex;
            flex-direction: column;
        }

        .checkout-item-name { color: #eee; font-weight: 700; font-size: 1rem; }
        .checkout-item-price { color: var(--neon-green); font-family: 'Orbitron'; font-size: 0.9rem; margin-top: 3px;}

        .remove-btn {
            background: rgba(255, 51, 51, 0.1);
            border: 1px solid #ff3333;
            color: #ff3333;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .remove-btn:active { background: #ff3333; color: #fff; }

        .checkout-total {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            margin-bottom: 20px;
            font-size: 1.3rem;
            font-weight: 700;
            border-top: 1px solid #333;
            padding-top: 15px;
        }

        .checkout-total span:last-child {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-green);
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
        }

        .pc-info-input {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }
        
        .pc-info-input label {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .pc-input-modal {
            width: 100%;
            background: #1a1a1a;
            border: 2px solid #333;
            padding: 15px;
            border-radius: 10px;
            color: #fff;
            font-size: 1.2rem;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            outline: none;
            transition: 0.3s;
        }

        .pc-input-modal:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        /* --- ВЫБОР ОПЛАТЫ --- */
        .payment-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .payment-label {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .payment-methods {
            display: flex;
            gap: 10px;
        }

        .payment-method {
            flex: 1;
            padding: 12px;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 700;
            color: #888;
        }

        .payment-method.selected {
            border-color: var(--neon-blue);
            color: var(--neon-blue);
            background: rgba(0, 240, 255, 0.05);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .payment-method:active { transform: scale(0.97); }

        .error-msg {
            color: #ff3333;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 15px;
            display: none;
            font-weight: 700;
        }

        .btn-submit {
            width: 100%;
            background: var(--neon-green);
            color: #000;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 1.1rem;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.4);
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-submit:disabled {
            background: #222;
            color: #555;
            box-shadow: none;
            cursor: not-allowed;
        }

        .btn-submit:active:not(:disabled) { transform: scale(0.98); }

        /* --- ФОРМА ОЖИДАНИЯ (НАЛИЧНЫЕ) --- */
        .waiting-form {
            display: none;
            text-align: center;
            padding: 30px 10px;
        }

        .waiting-form.active {
            display: block;
        }

        .waiting-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }

        .waiting-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            color: var(--neon-blue);
            margin-bottom: 10px;
        }

        .waiting-text {
            color: #ccc;
            font-size: 1rem;
            line-height: 1.5;
        }

        .waiting-text.warning {
            color: #ffaa00;
            font-weight: 700;
            margin-top: 10px;
        }

        .footer {
            text-align: center;
            padding: 20px;
            font-size: 0.8rem;
            color: #555;
            border-top: 1px solid #222;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header class="hero">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
        <div class="logo">SFX</div>
        <div class="hero-content">
            <h1>SFX</h1>
            <p>Твой киберспорт. Твой бар. Твой ПК.</p>
            
            <div class="review-buttons">
                <a href="https://yandex.ru/maps" target="_blank" class="review-btn yandex">Я<span>Яндекс</span></a>
                <a href="https://2gis.ru" target="_blank" class="review-btn 2gis">2<span>2ГИС</span></a>
            </div>
        </div>
    </header>

    <section class="menu-section">
        <h2 class="menu-title">Онлайн-бар <span>SFX</span></h2>
        <div class="grid" id="menuGrid"></div>
    </section>

    <footer class="footer">
        SFX Gaming Club | Вологда, ул. Возрождения, 35к1
    </footer>

    <div class="floating-cart" id="floatingCart" onclick="openCartModal()">
        <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
        <div class="cart-badge" id="cartBadge">0</div>
    </div>

    <div class="modal-overlay" id="cartModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Твой заказ</h3>
                <button class="close-btn" onclick="closeCartModal()">&times;</button>
            </div>
            
            <div id="checkoutItems"></div>
            
            <div class="checkout-total">
                <span>Итого:</span>
                <span id="modalTotal">0 ₽</span>
            </div>

            <div class="pc-info-input">
                <label>Введите номер вашего ПК</label>
                <input type="number" id="pcNumberModal" class="pc-input-modal" placeholder="Например, 5" inputmode="numeric">
            </div>

            <!-- Выбор способа оплаты -->
            <div class="payment-options">
                <label class="payment-label">Способ оплаты</label>
                <div class="payment-methods">
                    <div class="payment-method selected" id="paySbp" onclick="selectPayment('sbp')">СБП (онлайн)</div>
                    <div class="payment-method" id="payCash" onclick="selectPayment('cash')">Наличные</div>
                </div>
            </div>
            
            <div class="error-msg" id="errorMsg">Пожалуйста, введите номер ПК!</div>

            <button class="btn-submit" id="payBtn" onclick="submitOrder()" disabled>Оплатить заказ</button>

            <!-- Форма ожидания для наличных -->
            <div class="waiting-form" id="waitingForm">
                <div class="waiting-icon">⏳</div>
                <div class="waiting-title" id="waitingTitle">Ожидайте администратора</div>
                <div class="waiting-text" id="waitingText">Пожалуйста, подготовьте наличные. Админ скоро подойдет к вашему ПК.</div>
            </div>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, name: "Adrenaline Rush", price: 150, img: "https://placehold.co/200x200/1a1a1a/fff?text=Adrenaline", isEnergy: true },
            { id: 2, name: "Burn", price: 140, img: "https://placehold.co/200x200/1a1a1a/fff?text=Burn", isEnergy: true },
            { id: 3, name: "Flash", price: 130, img: "https://placehold.co/200x200/1a1a1a/fff?text=Flash", isEnergy: true },
            { id: 4, name: "Кофе Американо", price: 100, img: "https://placehold.co/200x200/1a1a1a/fff?text=Coffee" },
            { id: 5, name: "Сэндвич с курицей", price: 180, img: "https://placehold.co/200x200/1a1a1a/fff?text=Sandwich" },
            { id: 6, name: "Сэндвич с ветчиной", price: 170, img: "https://placehold.co/200x200/1a1a1a/fff?text=Sandwich" },
            { id: 7, name: "Чипсы Lays", price: 90, img: "https://placehold.co/200x200/1a1a1a/fff?text=Chips" },
            { id: 8, name: "Орешки", price: 80, img: "https://placehold.co/200x200/1a1a1a/fff?text=Nuts" },
            { id: 9, name: "Комбо (Энергос+Сэндвич)", price: 280, img: "https://placehold.co/200x200/1a1a1a/fff?text=Combo", isEnergy: true },
            { id: 10, name: "Вода", price: 50, img: "https://placehold.co/200x200/1a1a1a/fff?text=Water" }
        ];

        let cart = [];
        let currentPaymentMethod = 'sbp';

        const menuGrid = document.getElementById('menuGrid');
        products.forEach(product => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <img src="${product.img}" class="card-img" alt="${product.name}">
                <h3>${product.name}</h3>
                <div class="price">${product.price} ₽</div>
                <div id="controls-${product.id}">
                    <button class="add-btn" onclick="addToCart(${product.id})">В корзину</button>
                </div>
            `;
            menuGrid.appendChild(card);
        });

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const existingItem = cart.find(item => item.id === id);
            if (existingItem) { existingItem.qty++; } else { cart.push({ ...product, qty: 1 }); }
            updateUI();
        }

        function removeFromCart(id) {
            const itemIndex = cart.findIndex(item => item.id === id);
            if (itemIndex > -1) {
                if (cart[itemIndex].qty > 1) { cart[itemIndex].qty--; } else { cart.splice(itemIndex, 1); }
            }
            updateUI();
        }

        function updateUI() {
            products.forEach(p => {
                const controlsContainer = document.getElementById(`controls-${p.id}`);
                const cartItem = cart.find(item => item.id === p.id);
                if (cartItem) {
                    controlsContainer.innerHTML = `<div class="qty-controls"><button class="qty-btn" onclick="removeFromCart(${p.id})">-</button><span class="qty-val">${cartItem.qty}</span><button class="qty-btn" onclick="addToCart(${p.id})">+</button></div>`;
                } else {
                    controlsContainer.innerHTML = `<button class="add-btn" onclick="addToCart(${p.id})">В корзину</button>`;
                }
            });

            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            const floatingCart = document.getElementById('floatingCart');
            const cartBadge = document.getElementById('cartBadge');
            if (totalItems > 0) { floatingCart.classList.add('active'); cartBadge.textContent = totalItems; } else { floatingCart.classList.remove('active'); }

            if (cartModal.classList.contains('active')) { renderCartModal(); }
        }

        const cartModal = document.getElementById('cartModal');
        const checkoutItems = document.getElementById('checkoutItems');
        const modalTotal = document.getElementById('modalTotal');
        const pcInputModal = document.getElementById('pcNumberModal');
        const payBtn = document.getElementById('payBtn');
        const errorMsg = document.getElementById('errorMsg');
        const waitingForm = document.getElementById('waitingForm');

        function openCartModal() {
            if (cart.length === 0) return;
            waitingForm.classList.remove('active');
            payBtn.style.display = 'block';
            renderCartModal();
            cartModal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeCartModal() {
            cartModal.classList.remove('active');
            document.body.style.overflow = '';
        }

        function renderCartModal() {
            checkoutItems.innerHTML = '';
            let total = 0;
            let hasEnergy = false;
            cart.forEach(item => {
                total += item.price * item.qty;
                if (item.isEnergy) hasEnergy = true;
                const div = document.createElement('div');
                div.className = 'checkout-item';
                div.innerHTML = `<div class="checkout-item-info"><span class="checkout-item-name">${item.name} <span style="color:#888; font-size:0.8rem;">x${item.qty}</span></span><span class="checkout-item-price">${item.price * item.qty} ₽</span></div><button class="remove-btn" onclick="removeFromCart(${item.id})">&times;</button>`;
                checkoutItems.appendChild(div);
            });
            modalTotal.textContent = `${total} ₽`;
            checkPcInput();
        }

        pcInputModal.addEventListener('input', checkPcInput);

        function checkPcInput() {
            const pcVal = pcInputModal.value.trim();
            if (pcVal && cart.length > 0) { payBtn.disabled = false; errorMsg.style.display = 'none'; } else { payBtn.disabled = true; if (cart.length > 0) { errorMsg.style.display = 'block'; } else { errorMsg.style.display = 'none'; } }
        }

        function selectPayment(method) {
            currentPaymentMethod = method;
            document.getElementById('paySbp').classList.remove('selected');
            document.getElementById('payCash').classList.remove('selected');
            if (method === 'sbp') { document.getElementById('paySbp').classList.add('selected'); } else { document.getElementById('payCash').classList.add('selected'); }
        }

        cartModal.addEventListener('click', (e) => { if (e.target === cartModal) closeCartModal(); });

        // --- ЛОГИКА ОПЛАТЫ ---
        function submitOrder() {
            const pcVal = pcInputModal.value.trim();
            if (!pcVal || cart.length === 0) return;

            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const hasEnergy = cart.some(item => item.isEnergy);
            const orderData = { pc: pcVal, items: cart, total: total, method: currentPaymentMethod };

            console.log('Заказ:', orderData);

            if (currentPaymentMethod === 'cash') {
                // Показываем форму ожидания
                payBtn.style.display = 'none';
                document.querySelector('.payment-options').style.display = 'none';
                document.querySelector('.pc-info-input').style.display = 'none';
                document.querySelector('.checkout-total').style.display = 'none';
                checkoutItems.style.display = 'none';
                waitingForm.classList.add('active');

                if (hasEnergy) {
                    document.getElementById('waitingTitle').textContent = 'Подготовьте паспорт';
                    document.getElementById('waitingText').innerHTML = 'Вы заказали энергетик. Админ подойдет и попросит <strong style="color:#ffaa00;">паспорт</strong> для подтверждения возраста (18+).';
                } else {
                    document.getElementById('waitingTitle').textContent = 'Ожидайте администратора';
                    document.getElementById('waitingText').textContent = 'Пожалуйста, подготовьте наличные. Админ скоро подойдет к вашему ПК.';
                }
                // Очистка после показа
                setTimeout(() => {
                    cart = [];
                    pcInputModal.value = '';
                    updateUI();
                }, 2000);
            } else {
                // СБП - реальная оплата (демо-ссылка)
                // ВСТАВЬ СЮДА СВОЮ ССЫЛКУ НА СБП
                const sbpLink = "https://qr.nspk.ru/AS1000000000000000000000000000000"; // ЗАМЕНИ НА РЕАЛЬНУЮ ССЫЛКУ
                window.open(sbpLink, '_blank');
                alert(`Оплата СБП на сумму ${total} ₽.\nНомер ПК: ${pcVal}\n\nПосле оплаты админ получит уведомление.`);
                cart = [];
                pcInputModal.value = '';
                updateUI();
                closeCartModal();
            }
        }
    </script>
</body>
</html>
